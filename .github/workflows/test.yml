name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest   # where mxbroker runs; still pure Python, no CubeMX needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python test_mxbroker.py
